[project]
name = "hindi-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.163.1",
    "numpy<2",
    "onnxruntime<1.20",
    "openai>=3.51.0",
    "pymupdf==1.24.14",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "sentence-transformers<4",
    "streamlit>=1.67.0",
    "torch==2.2.2",
    "transformers<4.50",
]

[project.scripts]
hindi-rag = "hindi_rag:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
